server:
  port: 8082

spring:
  application:
    name: driver-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/drivers_db}
    username: ${SPRING_DATASOURCE_USERNAME:transport}
    password: ${SPRING_DATASOURCE_PASSWORD:transport}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.transport.driver: INFO