name: Java CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [kafka-producer, kafka-consumer]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            kafka-producer/pom.xml
            kafka-consumer/pom.xml
            kafka-producer/.mvn/wrapper/maven-wrapper.properties
            kafka-consumer/.mvn/wrapper/maven-wrapper.properties
      - name: Verify Maven Wrapper
        run: |
          test -f mvnw
          test -f .mvn/wrapper/maven-wrapper.properties
          chmod +x mvnw
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
